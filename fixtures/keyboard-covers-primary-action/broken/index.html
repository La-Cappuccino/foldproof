<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay (broken: the soft keyboard covers the primary action)</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 16px/1.4 system-ui, sans-serif; color: #111; }
  .app { height: 100%; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
  h1 { margin: 0; font-size: 20px; }
  main { flex: 1; padding: 16px; }
  label { display: block; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; min-height: 44px; font: inherit; padding: 8px 12px; border: 1px solid #999; border-radius: 6px; }
  .summary { margin: 16px 0 0; color: #444; }
  /* BROKEN: the call to action is pinned to the bottom of the LAYOUT viewport. The page keeps the engine
     default (Chrome 108+: interactive-widget=resizes-visual), so the layout viewport does not shrink when
     the soft keyboard opens and the keyboard paints over the button. The task cannot be finished without
     first dismissing the keyboard. */
  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
  button { width: 100%; min-height: 48px; font: inherit; font-weight: 600; background: #1a56db; color: #fff; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<div class="app">
  <header><h1>Pay invoice</h1></header>
  <main>
    <label for="amount">Amount (NOK)</label>
    <input id="amount" name="amount" inputmode="decimal" autocomplete="off">
    <p class="summary">Invoice 2026-117. Due in 14 days.</p>
  </main>
  <div class="cta"><button id="pay" type="button">Pay</button></div>
</div>
</body>
</html>
