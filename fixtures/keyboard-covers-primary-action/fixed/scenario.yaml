foldproof: 1
id: keyboard-covers-primary-action-fixed
title: "Fixed: the layout viewport shrinks with the keyboard; Pay stays reachable and the amount, focus and caret survive"
profiles: [google-pixel-10-pro]
task:
  url: /keyboard-covers-primary-action/fixed/
  ready: { selector: "#pay" }
  controls: ["#pay"]
  state: { form: all, focus: same-element, selection: exact, scroll: anchor }
  setup:
    - { fill: "#amount", value: "1250" }
    - { focus: "#amount" }
steps:
  - transition: { kind: keyboard-open, to: { keyboard: { height: 300 } } }
    assert: [reachable, state-preserved]
  - transition: keyboard-close
    assert: [reachable, state-preserved]
expect: { verdict: pass }
tags: [fixture, keyboard, phone]
