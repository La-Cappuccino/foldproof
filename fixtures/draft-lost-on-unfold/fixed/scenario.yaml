foldproof: 1
id: draft-lost-on-unfold-fixed
title: "Fixed: unfolding mid-draft reflows with CSS; the draft, caret, focus and Send survive"
profiles: [microsoft-surface-duo, google-pixel-9-pro-fold]
start: { posture: closed }
task:
  url: /draft-lost-on-unfold/fixed/
  ready: { selector: "#send" }
  controls: ["#send", "role=button[name='Save draft']"]
  state: { form: all, focus: same-element, selection: exact, scroll: anchor }
  setup:
    - { fill: "#body", value: "Hei, vedlagt er avtalen vi diskuterte." }
    - { focus: "#body", select: [4, 7] }
steps:
  - transition: unfold
    assert: preset@1
  - operate: { target: "#send", expect: { visible: "#sent" } }
expect: { verdict: pass }
tags: [fixture, transition, foldable]
