foldproof: 1
id: stale-async-layout-after-round-trip-fixed
title: "Fixed: unfold → fold → unfold with CSS-only layout; the draft, caret and Save survive the round trip"
profiles: [microsoft-surface-duo, google-pixel-9-pro-fold]
start: { posture: closed }
task:
  url: /stale-async-layout-after-round-trip/fixed/
  ready: { selector: "#save" }
  controls: ["#save"]
  state: { form: all, focus: same-element, selection: exact, scroll: none }
  setup:
    - { fill: "#body", value: "Ring kunden om avtalen" }
    - { focus: "#body", select: [0, 4] }
steps:
  - transition: unfold
    assert: preset@1
    settle: { min_ms: 0, max_ms: 400 }
  - transition: fold
    assert: preset@1
    settle: { min_ms: 0, max_ms: 400 }
  - transition: unfold
    assert: preset@1
  - operate: { target: "#save", expect: { visible: "#saved" } }
settle: { quiet_frames: 2, min_ms: 1200, max_ms: 4000 }
expect: { verdict: pass }
tags: [fixture, transition, round-trip, async]
