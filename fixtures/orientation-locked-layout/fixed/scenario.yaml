foldproof: 1
id: orientation-locked-layout-fixed
title: "Fixed: the checkout reflows in landscape; the task and the typed card number survive the rotation"
profiles: [google-pixel-10-pro, google-pixel-tablet]
start: { orientation: portrait }
task:
  url: /orientation-locked-layout/fixed/
  ready: { selector: "#pay" }
  controls: ["#pay", "#card"]
  state: { form: all, focus: none, selection: none, scroll: none }
  setup:
    - { fill: "#card", value: "4242 4242 4242 4242" }
steps:
  - transition: rotate
    assert: [reachable, state-preserved, no-remount, no-element-loss]
  - transition: rotate
    assert: [reachable, state-preserved, no-remount, no-element-loss]
  - operate: { target: "#pay", expect: { visible: "#paid" } }
expect: { verdict: pass }
tags: [fixture, transition, orientation, wcag-1-3-4]
