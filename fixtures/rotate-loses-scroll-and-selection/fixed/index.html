<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field notes (fixed: rotation reflows; the browser keeps the reading position and focus)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; }
  article { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  p { margin: 0 0 12px; }
  .note-box { margin: 16px 0; padding: 12px; border: 1px solid #c9c9c9; border-radius: 8px; background: #fafafa; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; min-height: 56px; font: inherit; padding: 8px; }
  button { min-height: 44px; margin-top: 8px; padding: 0 16px; font: inherit; }
</style>
</head>
<body>
<article>
  <h1>Field notes</h1>
  <div id="before"></div>
  <section class="note-box">
    <label for="note">Margin note</label>
    <textarea id="note" name="note" placeholder="Add a note to this section"></textarea>
    <button id="save" type="button">Save note</button>
  </section>
  <div id="after"></div>
</article>
<script>
  const para = (i) => `<p id="p${i}">Paragraph ${i}: lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p>`;
  document.getElementById('before').innerHTML = Array.from({ length: 11 }, (_, i) => para(i + 1)).join('');
  document.getElementById('after').innerHTML = Array.from({ length: 29 }, (_, i) => para(i + 12)).join('');
  // FIXED: no orientation handler. The browser reflows the same DOM; scroll anchoring keeps the
  // paragraph under the reader in view, and focus and the selection in the textarea are untouched.
</script>
</body>
</html>
